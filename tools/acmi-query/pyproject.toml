[project]
name = "acmi-query"
version = "0.1.0"
description = "Index and query Tacview ACMI recordings from DCS World"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff", "ty"]

[project.scripts]
acmi-query = "acmi_query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["acmi_query.py"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"
