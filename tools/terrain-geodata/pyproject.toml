[project]
name = "terrain-geodata"
version = "0.1.0"
description = "Export DCS World terrain data from the game install as standard GIS files"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "humanize>=4.17.0",
  "luaparser>=4.2.0",
  "numpy>=2.3",
  "opencv-python-headless>=4.12",
  "pyogrio>=0.11",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "shapely>=2.1",
  "structlog>=26.1.0",
]

[dependency-groups]
dev = ["ruff", "ty", "types-rasterio>=1.5.2.20261122"]

[project.scripts]
terrain-geodata = "terrain_geodata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrain_geodata"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"
