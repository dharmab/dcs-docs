[project]
name = "terrain-geodata"
version = "0.1.0"
description = "Export DCS World terrain data from the game install as standard GIS files"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.3",
  "opencv-python-headless>=4.12",
  "pyogrio>=0.11",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "shapely>=2.1",
]

[dependency-groups]
dev = ["ruff", "ty"]

[project.scripts]
terrain-geodata = "terrain_geodata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrain_geodata"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"
